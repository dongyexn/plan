# 바탕화면 위젯 Lite (Tauri v2) — 빌드는 GitHub Actions 가 한다(.github/workflows/widget-lite.yml)
# ⚠ 버전 규칙(Electron 판과 동일): widget-lite/ 가 바뀐 회차마다 version 을 올려서 전달한다.
[package]
name = "hplan-widget-lite"
version = "0.9.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
# ResizeDirection 은 tauri 가 재수출하지 않는다 — 같은 2.x 로 통일 해석되므로 직접 의존해도 사본이 늘지 않는다
tauri-runtime = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
dirs = "5"
open = "5"
rfd = "0.14"
# native-tls(schannel) 기본 — 사내 보안장비의 사설 루트 인증서가 윈도우 저장소에 있으면 그대로 통한다
reqwest = { version = "0.12", features = ["blocking"] }
tauri-winrt-notification = "0.7"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# exe 를 작게 — 크기가 이 파일럿의 존재 이유다
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
