# 배포 전 자동 검증 — npm test 한 번으로 정적·권한·브라우저 회귀를 순서대로 실행한다.
# 로컬: npm ci && npx playwright install chromium && npm test
name: smoke
# 브랜치 push 와 PR 이 같은 커밋을 두 번 시험하지 않게 — PR 과 main 반영 때만
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read   # 1287(보안 감사): 기본 토큰 권한을 읽기로

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # pets.mjs 가 main 과 비교해 펫 파일이 바뀐 PR 만 75종 전부 돈다
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 시험 파일 확인
        run: |
          node --version
          for f in scripts/test/static-audit.mjs scripts/test/rules-auth.mjs scripts/test/run-all.mjs scripts/test/smoke.mjs scripts/test/rainbow-render.mjs scripts/test/e2e-defect.mjs index.html app.js package.json package-lock.json; do
            [ -f "$f" ] || { echo "::error::$f 가 저장소에 없습니다"; exit 1; }
          done
          echo "확인 완료"

      # 1285: 브라우저 파일은 캐시(playwright 버전 = package-lock 이 같으면 다시 받지 않음) · 시스템 라이브러리는 매번(apt)
      - name: 브라우저 캐시
        id: pwc
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 의존성·브라우저 준비
        run: |
          npm ci
          if [ "${{ steps.pwc.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi

      - name: 전체 회귀 게이트
        env:
          TEST_JOBS: 3   # 1285: 러너 4코어 — 브라우저 시험 셋을 동시에(시험마다 포트가 다르다)
          LIVE_E2E_EMAIL: ${{ secrets.LIVE_E2E_EMAIL }}
          LIVE_E2E_PASSWORD: ${{ secrets.LIVE_E2E_PASSWORD }}
          LIVE_E2E_SECOND_EMAIL: ${{ secrets.LIVE_E2E_SECOND_EMAIL }}
          LIVE_E2E_SECOND_PASSWORD: ${{ secrets.LIVE_E2E_SECOND_PASSWORD }}
        run: npm test

      # 1289: 배포본(주석 걷기 + terser)으로 한 번 더 — 줄인 판에서만 깨지는 것을 병합 전에 잡는다
      - name: 배포본 회귀
        env:
          TEST_JOBS: 3
        run: node scripts/test/run-built.mjs
