# 배포 전 자동 검증 — 정적 감사(FAIL 0) 뒤에 브라우저 스모크를 돈다.
# 로컬에서도 같은 것을 돌릴 수 있다: node scripts/test/static-audit.mjs · node scripts/test/smoke.mjs
name: smoke
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 정적 감사
        run: node scripts/test/static-audit.mjs
      - name: 브라우저 준비
        run: |
          npm i --no-save playwright playwright-core
          npx playwright install --with-deps chromium
      - name: 스모크
        run: node scripts/test/smoke.mjs
