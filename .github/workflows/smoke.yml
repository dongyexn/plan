# 배포 전 자동 검증 — 정적 감사(FAIL 0) 뒤에 브라우저 스모크를 돈다.
# 로컬에서도 같은 것을 돌릴 수 있다:
#   node scripts/test/static-audit.mjs
#   npm i --no-save playwright && npx playwright install chromium && node scripts/test/smoke.mjs
# ⚠ 어느 단계에서 깨졌는지 한눈에 보이도록 step 을 잘게 나눠 둔다 — 합치지 말 것.
name: smoke
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # 시험 파일이 저장소에 실제로 올라와 있는지 먼저 확인한다 —
      # 워크플로만 올리고 스크립트를 빠뜨리면 여기서 이유가 분명하게 드러난다.
      - name: 시험 파일 확인
        run: |
          node --version
          for f in scripts/test/static-audit.mjs scripts/test/smoke.mjs index.html app.js; do
            [ -f "$f" ] || { echo "::error::$f 가 저장소에 없습니다 — 앱 파일도 함께 올렸는지 확인하세요"; exit 1; }
          done
          echo "확인 완료"

      - name: 정적 감사
        run: node scripts/test/static-audit.mjs

      - name: 브라우저 준비
        run: |
          npm i --no-save playwright playwright-core
          npx playwright install --with-deps chromium

      - name: 스모크
        run: node scripts/test/smoke.mjs
