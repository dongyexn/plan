# 조달청 가격정보 — 매달 3일 05:17(KST) 공공데이터포털 「나라장터 가격정보현황서비스」에서 받아 data/g2b-price.json 을 새로 쓴다.
# 앱 물가정보 검색의 「조달청 가격정보」가 이 파일을 읽는다. 값이 바뀌었을 때만 main 에 커밋하고, 그 뒤 pages 가 다시 배포한다(workflow_run).
# 준비: 리포 Settings → Secrets and variables → Actions 에 G2B_KEY(공공데이터포털 인증키 — 개발계정 하루 1,000건, 한 번에 약 80건 쓴다).
# 조달청은 반기(4월·10월)마다 고시하므로 매달 돌려도 대개 바뀐 값이 없다. 바로 반영하려면 Actions 탭에서 Run workflow.
name: g2b-price
on:
  schedule:
    - cron: '17 20 2 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: g2b-price
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 조달청 가격정보 받기
        env:
          G2B_KEY: ${{ secrets.G2B_KEY }}
        run: node scripts/g2b-price.mjs
      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- data/g2b-price.json; then echo "바뀐 값 없음"; exit 0; fi
          git config user.name "g2b-price"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/g2b-price.json
          git commit -m "조달청 가격정보 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
